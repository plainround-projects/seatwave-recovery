# pgBackRest 2.60.0 for the seatwave-recovery lab (Module 40), checked against pgBackRest's
# configuration reference and user guide on 12 November 2026 and run against RustFS 1.0.5.
# The store's keys and the cipher passphrase are NOT here: scripts/stack.sh generates them into
# .secrets/pgbackrest/credentials.conf (ignored by git), which Compose mounts as an include file
# (/etc/pgbackrest/conf.d), so they are in no image, no Compose file and no environment variable.
# In production the passphrase also has a second copy outside the lab (Section 10).

[seatwave]
pg1-path=/var/lib/postgresql/18/docker

[global]
# Repository 1: the lab's S3-compatible store, standing in for a bucket in region-b.
repo1-type=s3
repo1-s3-endpoint=object-store
repo1-storage-port=9000
# pgBackRest reaches an S3 store over TLS only. The store's certificate is checked against the
# lab's own authority, not skipped (repo1-storage-verify-tls stays at its default, y).
repo1-storage-ca-file=/etc/seatwave-tls/ca.pem
repo1-s3-uri-style=path
repo1-s3-bucket=seatwave-backups
# RustFS answers for the region us-east-1, the region name its requests are signed with.
repo1-s3-region=us-east-1
repo1-path=/seatwave
# Encrypted before it leaves the machine; a stolen bucket holds nothing readable.
repo1-cipher-type=aes-256-cbc
# Full backups kept 35 days, with the log since the oldest (Module 35's production period, Module
# 42's register), so a restore can always fall back to an older backup when one is unreadable.
repo1-retention-full-type=time
repo1-retention-full=35
# Zstandard at its default level 3 instead of the default gzip at level 6: a faster codec, so
# compression is less likely to be what limits the backup and restore rates measured here.
compress-type=zst
compress-level=3
# Parallel transfer: what Section 6c's drill model calls streams.
process-max=4
start-fast=y
# Push and get the log in batches, so archiving keeps up and a slow store does not stall the primary.
archive-async=y
spool-path=/var/spool/pgbackrest
# The console carries the drill's evidence; the containers keep no log files of their own.
log-level-console=info
log-level-file=off
