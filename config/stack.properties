# The lab stack of compose.yaml, for the stack tests and the lab programs.
# Every key is required; StackSettings reports every missing or out-of-range key at once.
db.primaryUrl=jdbc:postgresql://127.0.0.1:24010/seatwave
db.restoreUrl=jdbc:postgresql://127.0.0.1:24011/seatwave
db.copyUrl=jdbc:postgresql://127.0.0.1:24012/seatwave
db.appUser=seatwave_app
db.appPasswordFile=.secrets/app.password
db.adminUser=postgres
db.adminPasswordFile=.secrets/postgres.password
db.ownerUser=seatwave_owner
db.ownerPasswordFile=.secrets/owner.password
db.replicatorUser=seatwave_replicator
db.replicatorPasswordFile=.secrets/replicator.password
# The copy reaches the primary by its service name inside the Compose network.
db.replicationHost=primary
db.connectTimeoutMillis=2000
# The load generator's pool: 16 connections carry a few hundred confirms a second of a few
# milliseconds each. After a failover a connection to the old writer fails on use and is replaced;
# the 30-minute lifetime is the model's (Section 6d) and Hikari's default.
pool.size=16
pool.maxLifetimeMillis=1800000
# At most this many confirms in flight; one that finds no room is counted as not sent.
load.maxInFlight=256
# A promoted copy moves each sequence this far past its highest id: the ids the lost primary handed
# out but never shipped must not be reused. 1,500 confirms a second (Module 19) for the 5-minute
# RPO is 450,000; 1,000,000 covers it twice over.
promotion.sequenceMargin=1000000
